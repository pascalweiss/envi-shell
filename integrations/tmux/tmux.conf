#===============================================================================
# ENVI-SHELL TMUX CONFIGURATION
#===============================================================================
# Cross-platform tmux configuration for development environments
# Features: Status bar with session info, container monitoring, git integration
# Theme: Deep night blue with cyan accents and gradient colors
#===============================================================================

#===============================================================================
# BASIC CONFIGURATION
#===============================================================================

# Mouse support for modern terminals
set -g mouse on

# Reduce delay after Escape so vim/zsh-vi-mode/arrow keys feel responsive
# (tmux default is 500ms, which manifests as perceived input lag)
set -sg escape-time 10

# Start window and pane numbering at 1 for more intuitive navigation
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows when one is closed
set -g renumber-windows on

# Killing the session the client is attached to (e.g. via choose-tree "x") would
# detach the client by default, dropping the user back to the bare terminal.
# Instead, switch to the most recently used remaining session; only the last
# session standing still ends the client.
set -g detach-on-destroy off

# Forward pane directory as terminal title (enables tab labels in Alacritty, iTerm2, Kitty, etc.)
set -g set-titles on
set -g set-titles-string "#{b:pane_current_path}"

# Display pane numbers for 3 seconds when using prefix+q (default: 1 second)
set -g display-panes-time 3000

#===============================================================================
# CLIPBOARD INTEGRATION
#===============================================================================
# Vi-style copy mode with cross-platform clipboard support
# Automatically detects and uses the appropriate clipboard tool per OS

setw -g mode-keys vi
set -g set-clipboard on

# Default behavior: copy to tmux buffer on mouse selection
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# macOS: Use pbcopy for system clipboard integration
if-shell -b 'uname | grep -q Darwin' \
  'unbind -T copy-mode-vi MouseDragEnd1Pane; \
   bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"; \
   bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"; \
   bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"'

# Linux (Wayland): Prefer wl-copy when available
if-shell -b 'uname | grep -vq Darwin && command -v wl-copy >/dev/null 2>&1' \
  'unbind -T copy-mode-vi MouseDragEnd1Pane; \
   bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"; \
   bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"; \
   bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "wl-copy"'

# Linux (X11): Fallback to xclip for older systems
if-shell -b 'uname | grep -vq Darwin && ! command -v wl-copy >/dev/null 2>&1 && command -v xclip >/dev/null 2>&1' \
  'unbind -T copy-mode-vi MouseDragEnd1Pane; \
   bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"; \
   bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"; \
   bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"'

#===============================================================================
# STATUS BAR THEME
#===============================================================================
# Deep night blue theme with cyan accents and development-focused information
# Color Scheme: colour237 (dark gray bg), colour39 (cyan), colour117 (blue), colour228 (yellow)

# Status bar positioning and basic styling
set -g status-position bottom
set -g status-bg colour237
set -g status-fg colour153
set -g status-left-length 100
set -g status-right-length 60
set -g status-justify centre

# LEFT SIDE: Session hierarchy with gradient colors
# ◈ session │ ⧉ window/total │ ◧ pane/total │
# Colors: cyan → blue → yellow (left to right gradient)
set -g status-left " #[fg=colour39,bg=colour237,bold]◈ #S #[fg=colour59,bg=colour237]│ #[fg=colour117,bg=colour237]⧉ #{window_index}#[fg=colour59]/#{session_windows} #[fg=colour59,bg=colour237]│ #[fg=colour228,bg=colour237]◧ #{pane_index}#[fg=colour59]/#{window_panes} #[fg=colour59,bg=colour237]│ "

# CENTER: Disabled (no window/application name display)
set -g window-status-format ""
set -g window-status-current-format ""

# RIGHT SIDE: Development environment status
# ⬟/⬡ containers │ ⬢/⬡ k8s-cluster │ ⌂ hostname
# Filled symbols indicate active/running state, outline symbols indicate inactive/empty
set -g status-right "#[fg=colour39,bg=colour237]#(~/.envi/executables/bin/tmux-container-count) #[fg=colour59,bg=colour237]│ #[fg=colour135,bg=colour237]#(~/.envi/executables/bin/tmux-k8s-context) #[fg=colour59,bg=colour237]│ #[fg=colour153,bg=colour237,bold]⌂ #h "

#===============================================================================
# WINDOW & PANE STYLING
#===============================================================================

# Window list styling - current window highlighted in bold cyan
set -g window-status-current-style fg=cyan,bold

# Pane border styling with enhanced information display
set -g pane-border-style fg=colour237
set -g pane-active-border-style fg=cyan
set -g pane-border-status top

# Pane border content: directory path + git status
# ⟐ ~/path │ 🌿 branch ● (● = uncommitted changes indicator)
# Alternative symbols:  🌿 🔀 ⑂ ∂ ∴ ⦿ ⟢ ∇ ⑊ ≋
set -g pane-border-format " #[fg=colour117]⟐ #{s|#{HOME}|~|:pane_current_path} #[fg=colour59]│ #[fg=colour114]⑂ #(cd #{pane_current_path} && git branch --show-current 2>/dev/null)#[fg=colour196,bold]#(cd #{pane_current_path} && git status --porcelain 2>/dev/null | grep -q . && echo ' ●') "

#===============================================================================
# SPLIT PANE BEHAVIOR
#===============================================================================

# New panes inherit the current pane's directory by default.
# Overridden at runtime by enviinit when TMUX_SPLIT_FOLLOW_PWD=false.
bind-key % split-window -h -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"

#===============================================================================
# INTERFACE STYLING
#===============================================================================

# Message styling for tmux command feedback
set -g message-style bg=red,fg=white

# Copy-mode selection colors - readable dark cyan background
set -g mode-style bg=colour23,fg=colour0

#===============================================================================
# ENHANCED NAVIGATION
#===============================================================================

# Custom choose-tree (Ctrl-b w) with status bar color scheme
# Provides a high-density, professional hierarchical view
# Session: Cyan name | Window: Blue path | Pane: Yellow cmd + Green path
# Kept in an option because the session-closed hook below reopens the same view;
# #{E:...} expands the option first, then the format stored in it.
set -g @envi-tree-format '#{?pane_format,#[fg=colour228]#{pane_current_command} #[fg=colour59]│ #[fg=colour114]#{s|#{HOME}|~|:pane_current_path},#{?window_format,#[fg=colour117]#{s|#{HOME}|~|:pane_current_path}#[fg=colour117]#{window_flags},#[fg=colour39,bold]#{session_name}}}'

bind w choose-tree -Z -F '#{E:@envi-tree-format}'

# Killing the current session from the overview ("x") destroys the pane the overview
# lives in, so detach-on-destroy above only gets us as far as the bare shell of the
# next session. Reopen the overview there, so killing a session and then picking where
# to go next is one uninterrupted flow.
#
# The guard distinguishes "my own session died" from every other session death:
# a destroy-driven switch leaves client_last_session empty, while switch-client always
# sets it. So this stays quiet when another session is killed in the background, and
# the client_session check keeps it quiet for kill-session issued from a detached CLI.
# choose-tree's keys are compiled into tmux and cannot be rebound, hence the hook.
#
# That guard alone is not enough, though: session-closed fires once for the whole
# server, and its format variables are evaluated against whatever client tmux picks
# as "current", not necessarily the one whose session just died. An intentional quit
# (tmux-quit, bind X below) sets detach-on-destroy on for just that one session, so
# its own client detaches cleanly, but the hook still fires and can land on a
# completely different, unrelated client whose client_last_session happens to be
# empty too, popping the overview open there. tmux-quit and bind X set the
# @envi-quit flag right before killing their session so this hook can tell "an
# intentional quit just happened somewhere" apart from "a session died under a
# client that is about to be switched", and skip reopening the overview in the
# first case regardless of which client's state the hook sees.
set-hook -g session-closed {
  if -F '#{==:#{@envi-quit},1}' {
    set-option -g @envi-quit 0
  } {
    if -F '#{&&:#{client_session},#{==:#{client_last_session},}}' {
      choose-tree -Z -F '#{E:@envi-tree-format}'
    }
  }
}

# The other half of that: killing the current session on purpose, from the pane
# itself, should end tmux in this terminal rather than move the client into
# whatever session was used before (which is likely open in another terminal
# tab). Turning detach-on-destroy back on for this one session does exactly
# that and leaves every other session on the global setting above.
# `tmux-quit` is the same thing as a shell command.
bind X confirm-before -p "Kill session '#S' and leave tmux? (y/n)" {
  set-option -g @envi-quit 1
  set-option detach-on-destroy on
  kill-session
}

#===============================================================================
# COLOR REFERENCE
#===============================================================================
# colour39:  Bright cyan      - Sessions, containers
# colour117: Medium blue      - Windows, directory paths  
# colour228: Bright yellow    - Panes
# colour135: Purple          - Kubernetes context
# colour153: Light blue-gray - Hostname, default text
# colour59:  Dark gray       - Separators
# colour237: Very dark gray  - Background
# colour196: Bright red      - Git uncommitted changes
# colour114: Green          - Git branch names
#===============================================================================
